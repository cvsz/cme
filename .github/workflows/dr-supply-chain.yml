name: DR and Supply Chain

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/backup-postgres.sh"
      - "scripts/restore-postgres.sh"
      - "scripts/production/verify-restored-db.py"
      - "scripts/production/rotate-db-credentials.py"
      - "scripts/production/preflight.py"
      - "scripts/production/verify.py"
      - "scripts/production/rollback-check.py"
      - "scripts/production/rollback.py"
      - "Dockerfile"
      - ".github/workflows/dr-supply-chain.yml"
      - "docs/disaster-recovery.md"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cme
          POSTGRES_PASSWORD: cme
          POSTGRES_DB: cme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cme -d cme"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CME_APP_ENV: test
      CME_DATABASE_URL: postgresql://cme:cme@localhost:5432/cme
      CME_REDIS_URL: redis://localhost:6379/0
      CME_BACKUP_FILE: /tmp/cme.dump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install 'apps/api[dev]'
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsS https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Migrate source database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Seed restore sentinel
        run: psql "$CME_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA restore_sentinel; CREATE TABLE restore_sentinel.sentinel(id integer primary key); INSERT INTO restore_sentinel.sentinel VALUES (42);"
      - name: Backup source database and record timing
        shell: bash
        run: |
          set -euo pipefail
          backup_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          backup_started_epoch="$(date +%s)"
          sh scripts/backup-postgres.sh
          backup_completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          backup_duration="$(($(date +%s) - backup_started_epoch))"
          backup_size="$(stat -c %s "$CME_BACKUP_FILE")"
          backup_checksum="$(cat "$CME_BACKUP_FILE.sha256")"
          postgres_version="$(psql "$CME_DATABASE_URL" -Atc 'SHOW server_version')"
          {
            echo '### Isolated PostgreSQL restore drill'
            echo
            echo '| Evidence | Value |'
            echo '| --- | --- |'
            echo "| Backup started (UTC) | $backup_started |"
            echo "| Backup completed (UTC) | $backup_completed |"
            echo "| Backup duration (seconds) | $backup_duration |"
            echo "| Backup size (bytes) | $backup_size |"
            echo "| Backup SHA-256 | $backup_checksum |"
            echo "| PostgreSQL server version | $postgres_version |"
            echo "| Backup path | $CME_BACKUP_FILE (ephemeral CI runner) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create separate disposable restore database
        run: createdb --host=localhost --username=cme cme_restore
      - name: Restore target database and record timing
        shell: bash
        env:
          CME_DATABASE_URL: postgresql://cme:cme@localhost:5432/cme_restore
          CME_RESTORE_CONFIRM_DATABASE: cme_restore
          CME_ALLOW_DESTRUCTIVE_RESTORE: YES
        run: |
          set -euo pipefail
          restore_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          restore_started_epoch="$(date +%s)"
          sh scripts/restore-postgres.sh
          restore_completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          restore_duration="$(($(date +%s) - restore_started_epoch))"
          test "$(psql "$CME_DATABASE_URL" -Atc 'SELECT id FROM restore_sentinel.sentinel')" = "42"
          {
            echo "| Restore started (UTC) | $restore_started |"
            echo "| Restore completed (UTC) | $restore_completed |"
            echo "| Restore duration (seconds) | $restore_duration |"
            echo '| Restore target | cme_restore (disposable database) |'
            echo '| Restore result | PASS |'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify restored schema, indexes, data, and application readiness
        env:
          CME_DATABASE_URL: postgresql://cme:cme@localhost:5432/cme_restore
          CME_RESTORE_CONFIRM_DATABASE: cme_restore
        run: python scripts/production/verify-restored-db.py
      - name: Stage and verify a least-privilege runtime role in the isolated database
        env:
          CME_APP_ENV: test
          CME_ROTATION_ADMIN_URL: postgresql://cme:cme@localhost:5432/cme_restore
          CME_ROTATION_CONFIRM_DATABASE: cme_restore
          CME_ROTATION_ROLE: cme_runtime_next
          CME_ROTATION_MIGRATION_ROLE: cme_migrator
          CME_ROTATION_OUTPUT_FILE: /tmp/cme-runtime-role.env
        run: |
          set -euo pipefail
          psql "$CME_ROTATION_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE cme_migrator NOLOGIN'
          python scripts/production/rotate-db-credentials.py
          test "$(stat -c %a "$CME_ROTATION_OUTPUT_FILE")" = 600
          ! grep -q 'cme:cme@' "$CME_ROTATION_OUTPUT_FILE"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Build
        run: docker build --build-arg CME_RELEASE_SHA="$GITHUB_SHA" -t cme-api:ci .
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint=id cme-api:ci -u)" != "0"
      - name: Install Syft and Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.33.0
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Generate SBOM
        run: syft cme-api:ci -o spdx-json=/tmp/cme-api.spdx.json
      - name: Scan image
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 cme-api:ci
