name: DR and Supply Chain

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/backup-postgres.sh"
      - "scripts/restore-postgres.sh"
      - "Dockerfile"
      - ".github/workflows/dr-supply-chain.yml"
      - "docs/disaster-recovery.md"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cme
          POSTGRES_PASSWORD: cme
          POSTGRES_DB: cme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cme -d cme"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CME_DATABASE_URL: postgresql://cme:cme@localhost:5432/cme
      CME_BACKUP_FILE: /tmp/cme.dump
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsS https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Seed restore sentinel
        run: psql "$CME_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE restore_sentinel(id integer primary key); INSERT INTO restore_sentinel VALUES (42);"
      - name: Backup
        run: sh scripts/backup-postgres.sh
      - name: Destroy source data
        run: psql "$CME_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE restore_sentinel;"
      - name: Restore
        run: sh scripts/restore-postgres.sh
      - name: Verify restored data
        run: test "$(psql "$CME_DATABASE_URL" -Atc 'SELECT id FROM restore_sentinel')" = "42"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Build
        run: docker build -t cme-api:ci .
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint=id cme-api:ci -u)" != "0"
      - name: Install Syft and Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.33.0
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Generate SBOM
        run: syft cme-api:ci -o spdx-json=/tmp/cme-api.spdx.json
      - name: Scan image
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 cme-api:ci
