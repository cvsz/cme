name: CMe API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/cme-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "Makefile"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cme
          POSTGRES_PASSWORD: cme
          POSTGRES_DB: cme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cme -d cme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CME_DATABASE_URL: postgresql+psycopg://cme:cme@localhost:5432/cme_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'apps/api[dev]'
      - name: Lint
        run: ruff check apps/api
      - name: Format
        run: ruff format --check apps/api
      - name: Migrate test database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Test
        working-directory: apps/api
        run: pytest
      - name: Compile
        run: python -m compileall -q apps/api/cme_api
      - name: Build container
        run: docker build --build-arg CME_RELEASE_SHA="$GITHUB_SHA" -t cme-api:ci .
