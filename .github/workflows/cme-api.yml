name: CMe API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/cme-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "Makefile"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'apps/api[dev]'
      - name: Lint
        run: ruff check apps/api
      - name: Format
        run: ruff format --check apps/api
      - name: Test
        working-directory: apps/api
        run: pytest
      - name: Compile
        run: python -m compileall -q apps/api/cme_api
      - name: Build container
        run: docker build -t cme-api:ci .
